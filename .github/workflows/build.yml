name: build-espmod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMGUI_REF: v1.91.9      # pinned tag
  DOBBY_REF: 5dfc8546954ce3b3198132ab13fddb89ee92cdd7   # commit the upstream 'latest' release was built from (14 Mar); master HEAD has headers/sources out of sync
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-24

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project archive (sources uploaded as .zip)
        run: |
          if ! find . -maxdepth 4 -name CMakeLists.txt -not -path './.git/*' | grep -q .; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n1)
            if [ -n "$ZIP" ]; then
              echo "no CMakeLists.txt in tree; unpacking $ZIP"
              mkdir -p _unpacked
              unzip -q -o "$ZIP" -d _unpacked
            fi
          fi

      - name: Locate project root
        run: |
          CML=$(find . -maxdepth 4 -name CMakeLists.txt -not -path './.git/*' -not -path '*/third_party/*' \
                | awk -F/ '{print NF, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$CML" ] || [ ! -f "$(dirname "$CML")/src/main.cpp" ]; then
            echo "::error::project root (CMakeLists.txt + src/main.cpp) not found; repository files:"
            find . -not -path './.git/*' -type f | head -60
            exit 1
          fi
          PROJECT_DIR=$(dirname "$CML")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "project root: $PROJECT_DIR"

      - name: Fetch third-party sources
        run: |
          cd "$PROJECT_DIR"
          mkdir -p third_party
          git clone --depth 1 --branch "$IMGUI_REF" https://github.com/ocornut/imgui.git third_party/imgui
          # fetch-by-ref works for SHA, tag and branch alike
          git init -q third_party/Dobby
          git -C third_party/Dobby remote add origin https://github.com/jmpews/Dobby.git
          git -C third_party/Dobby fetch -q --depth 1 origin "$DOBBY_REF"
          git -C third_party/Dobby checkout -q FETCH_HEAD
          git -C third_party/Dobby submodule update --init --depth 1 || true
          {
            echo "imgui $(git -C third_party/imgui rev-parse HEAD) ($IMGUI_REF)"
            echo "Dobby $(git -C third_party/Dobby rev-parse HEAD) ($DOBBY_REF)"
          } | tee third-party-revisions.txt
          test -f third_party/imgui/backends/imgui_impl_opengl3.cpp
          test -f third_party/Dobby/include/dobby.h

      - name: Patch Dobby Linux/Android sources (stale after upstream refactors)
        run: |
          cd "$PROJECT_DIR/third_party/Dobby"
          # Each edit: file, sed expression, grep pattern, expected pre-patch match count.
          # A count mismatch means the pinned revision changed: fail instead of patching blindly.
          patch_one() {
            local file="$1" expr="$2" pat="$3" want="$4" got
            test -f "$file" || { echo "::error::$file not found"; exit 1; }
            got=$(grep -c -E "$pat" "$file" || true)
            echo "$file: '$pat' matches=$got (expected $want)"
            [ "$got" = "$want" ] || { echo "::error::unexpected match count in $file"; exit 1; }
            sed -i -E "$expr" "$file"
            ! grep -q -E "$pat" "$file" || { echo "::error::pattern still present in $file"; exit 1; }
          }
          PR=source/Backend/UserMode/PlatformUtil/Linux/ProcessRuntime.cc
          # MemRange::start is a method since a513555; RuntimeModule::load_address was renamed to ::base
          patch_one "$PR" 's/a\.start < b\.start/a.start() < b.start()/'  'a\.start < b\.start' 1
          patch_one "$PR" 's/module\.load_address/module.base/g'            'module\.load_address' 3
          # core/arch/Cpu.h no longer exists; ClearCache() is declared via dobby/dobby_internal.h
          patch_one source/Backend/UserMode/ExecMemory/code-patch-tool-posix.cc \
            '/^#include "core\/arch\/Cpu\.h"$/d' '^#include "core/arch/Cpu\.h"$' 1
          test -f source/core/arch/Cpu.h && { echo "::error::Cpu.h exists now; drop this patch"; exit 1; } || true
          # gettimeofday needs <sys/time.h> on bionic
          L=external/logging/logging.cc
          [ "$(grep -c -E '^#include <time\.h>$' "$L")" = 1 ] || { echo "::error::time.h anchor not unique in $L"; exit 1; }
          grep -q '^#include <sys/time\.h>$' "$L" || sed -i -E 's/^#include <time\.h>$/#include <time.h>\n#include <sys\/time.h>/' "$L"
          grep -q '^#include <sys/time.h>' external/logging/logging.cc || { echo "::error::sys/time.h not added"; exit 1; }
          # include cycle platform.h -> common.h -> os_arch_features.h -> platform.h: under ANDROID the inline body
          # uses OSMemory/kReadExecute before they are declared. Keep a declaration in os_arch_features.h and
          # define the function at the end of platform.h (valid for either include order).
          OA=common/os_arch_features.h; PH=source/PlatformUnifiedInterface/platform.h
          [ "$(grep -c -E '^inline void make_memory_readable\(void \*address, size_t size\) \{$' "$OA")" = 1 ] || { echo "::error::make_memory_readable not found once in $OA"; exit 1; }
          grep -q 'make_memory_readable' "$PH" && { echo "::error::$PH already defines make_memory_readable"; exit 1; } || true
          sed -i -E '/^inline void make_memory_readable\(void \*address, size_t size\) \{$/,/^\}$/c\inline void make_memory_readable(void *address, size_t size);' "$OA"
          grep -n 'make_memory_readable' "$OA"
          printf '\n\nnamespace features {\nnamespace android {\ninline void make_memory_readable(void *address, size_t size) {\n#if defined(ANDROID)\n  auto page = (void *)ALIGN_FLOOR(address, OSMemory::PageSize());\n  if (!OSMemory::SetPermission(page, OSMemory::PageSize(), kReadExecute)) {\n    return;\n  }\n#endif\n}\n} // namespace android\n} // namespace features\n' >> "$PH"
          git diff --stat

      - name: Patch Dobby arm64 closure bridge (Mach-O @PAGE syntax -> ELF)
        run: |
          cd "$PROJECT_DIR"
          ASM=third_party/Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm
          test -f "$ASM" || { echo "::error::$ASM not found; Dobby layout changed"; exit 1; }
          echo "--- macro definitions in $ASM:"; grep -n -E '#[[:space:]]*(define|if|ifdef|ifndef|else|endif|include)' "$ASM" || true
          # operand forms seen in the failing log: "<reg>, cdecl(sym)@PAGE" / "<reg>, <reg>, cdecl(sym)@PAGEOFF"
          SYM='cdecl\(common_closure_bridge_handler\)'
          RE_PAGE="^([[:space:]]*)adrp([[:space:]]+)([A-Za-z0-9_]+),[[:space:]]*(${SYM})@PAGE[[:space:]]*$"
          RE_OFF="^([[:space:]]*add[[:space:]]+)([A-Za-z0-9_]+),[[:space:]]*([A-Za-z0-9_]+),[[:space:]]*(${SYM})@PAGEOFF[[:space:]]*$"
          N_PAGE=$(grep -c -E "$RE_PAGE" "$ASM" || true)
          N_OFF=$(grep -c -E "$RE_OFF" "$ASM" || true)
          echo "match count: @PAGE=$N_PAGE @PAGEOFF=$N_OFF (expected 1/1, or 0/0 if upstream already fixed)"
          if [ "$N_PAGE" = 0 ] && [ "$N_OFF" = 0 ]; then
            if grep -q '@PAGE' "$ASM"; then echo "::error::unrecognised @PAGE usage remains"; grep -n '@PAGE' "$ASM"; exit 1; fi
            echo "nothing to patch"
          elif [ "$N_PAGE" = 1 ] && [ "$N_OFF" = 1 ]; then
            # ELF: ADRP page + :lo12: low bits; .hidden keeps the reference non-preemptible inside the DSO
            sed -i -E \
              -e "s/${RE_PAGE}/\\1.hidden \\4\\n\\1adrp\\2\\3, \\4/" \
              -e "s/${RE_OFF}/\\1\\2, \\3, :lo12:\\4/" \
              "$ASM"
            if grep -q '@PAGE' "$ASM"; then echo "::error::@PAGE still present after patch"; exit 1; fi
            echo "--- patched region:"; grep -n -B1 -A1 'common_closure_bridge_handler' "$ASM"
          else
            echo "::error::unexpected match counts; refusing to patch blindly"; grep -n '@PAGE' "$ASM"; exit 1
          fi

      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -d "$NDK" || { echo "::error::NDK not found on runner"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "NDK path: $NDK"; cat "$NDK/source.properties" | head -3

      - name: Configure
        run: |
          cd "$PROJECT_DIR"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_static \
            -DPlugin.SymbolResolver=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          cmake --build build -j"$(nproc)"

      - name: Verify artifact
        run: |
          cd "$PROJECT_DIR"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SO=build/libespmod.so
          test -f "$SO"
          "$BIN/llvm-readelf" -h "$SO" | grep -E 'Class|Machine'
          "$BIN/llvm-readelf" -h "$SO" | grep -q 'AArch64'
          "$BIN/llvm-readelf" -d "$SO" | grep NEEDED
          # unresolved libs outside the Android system set would fail at dlopen
          "$BIN/llvm-readelf" -d "$SO" | grep NEEDED | grep -Ev 'liblog|libEGL|libGLESv3|libandroid|libdl|libc\.so|libm\.so' && { echo "::error::unexpected NEEDED entry"; exit 1; } || true
          sha256sum "$SO" | tee build/libespmod.so.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: espmod-arm64-v8a
          path: |
            ${{ env.PROJECT_DIR }}/build/libespmod.so
            ${{ env.PROJECT_DIR }}/build/libespmod.so.sha256
            ${{ env.PROJECT_DIR }}/third-party-revisions.txt
          if-no-files-found: error
